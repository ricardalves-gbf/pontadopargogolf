<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golfe Ponta do Pargo — Madeira</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500&display=swap');

  :root {
    --sky-top: #6fb3d9;
    --sky-mid: #a7d4e8;
    --sky-horizon: #eaf3ef;
    --sea: #3d7a92;
    --sea-deep: #1f4f63;
    --cliff: #4a5c50;
    --cliff-dark: #2c3a32;
    --clay: #c17a4f;
    --ink-deep: #0c1412;
    --mist: #eef1ea;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--sea-deep);
    color: var(--mist);
    font-family: 'Space Grotesk', sans-serif;
    overflow-x: hidden;
  }

  .display { font-family: 'Fraunces', serif; font-optical-sizing: auto; }

  .stage {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-horizon) 62%, var(--sea) 62%, var(--sea-deep) 100%);
    overflow: hidden;
  }

  .scene-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 1.5rem;
    gap: 0.6rem;
  }

  .contact-line {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(1.05rem, 2.4vw, 1.5rem);
    color: var(--ink-deep);
    line-height: 1.4;
  }

  .contact-line a {
    color: var(--clay);
    text-decoration: none;
    font-weight: 600;
  }
  .contact-line a:hover { text-decoration: underline; }

  .contact-line.en {
    font-size: clamp(0.85rem, 1.7vw, 1.05rem);
    font-weight: 400;
    opacity: 0.75;
  }

  .contact-line.email-line {
    margin-top: 0.3rem;
    font-size: clamp(0.95rem, 2vw, 1.2rem);
    font-weight: 600;
  }
  .contact-line.email-line a { color: var(--clay); }

  .contact-card {
    background: rgba(238,241,234,0.85);
    padding: 1.3rem 2rem;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(12,20,18,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
  }

  .domains-footer {
    position: absolute;
    bottom: clamp(1.2rem, 4vh, 2.2rem);
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
  }

  .domain-chip {
    font-size: clamp(0.68rem, 1.3vw, 0.78rem);
    letter-spacing: 0.01em;
    padding: 0.35rem 0.8rem;
    background: rgba(238,241,234,0.7);
    border-radius: 999px;
    color: var(--ink-deep);
  }

  @media (max-width: 640px) {
    .contact-card { padding: 1.1rem 1.5rem; }
  }
</style>
</head>
<body>

<div class="stage">

  <svg class="scene-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff4d6" stop-opacity="0.9"/>
        <stop offset="45%" stop-color="#ffe9b0" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#ffe9b0" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="cliffGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5c6f61"/>
        <stop offset="100%" stop-color="#28352d"/>
      </linearGradient>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3d7a92"/>
        <stop offset="100%" stop-color="#1f4f63"/>
      </linearGradient>
    </defs>

    <!-- sun -->
    <circle cx="1220" cy="150" r="160" fill="url(#sunGlow)"/>
    <circle cx="1220" cy="150" r="46" fill="#fff8e7"/>

    <!-- sea -->
    <rect y="558" width="1600" height="342" fill="url(#seaGrad)"/>
    <g opacity="0.15" stroke="#eef1ea" stroke-width="2" fill="none">
      <path d="M0 600 Q 200 590 400 602 T 800 598 T 1200 604 T 1600 596"/>
      <path d="M0 660 Q 220 650 420 662 T 820 658 T 1220 664 T 1600 656"/>
      <path d="M0 730 Q 240 718 440 732 T 840 726 T 1240 734 T 1600 724"/>
    </g>

    <!-- rocky point / cliff jutting from the left, with lighthouse -->
    <path d="M0 900 L0 560
             C 60 540, 110 555, 150 540
             C 190 525, 210 495, 260 480
             C 310 465, 345 480, 380 465
             C 410 452, 415 430, 440 420
             C 460 412, 475 418, 480 430
             C 486 445, 470 460, 450 470
             C 500 468, 540 490, 560 520
             C 575 542, 570 560, 555 575
             C 600 590, 620 615, 610 640
             L0 640 Z"
          fill="url(#cliffGrad)" stroke="#1a2521" stroke-width="1.5"/>

    <!-- lighthouse on the point -->
    <g transform="translate(438, 420)">
      <!-- rock base under lighthouse -->
      <ellipse cx="0" cy="18" rx="34" ry="10" fill="#28352d"/>
      <!-- tower -->
      <rect x="-13" y="-95" width="26" height="115" fill="#eef1ea"/>
      <rect x="-13" y="-95" width="26" height="22" fill="#c17a4f"/>
      <rect x="-13" y="-55" width="26" height="10" fill="#28352d" opacity="0.55"/>
      <rect x="-13" y="-25" width="26" height="10" fill="#28352d" opacity="0.55"/>
      <!-- lantern room -->
      <rect x="-16" y="-112" width="32" height="17" rx="2" fill="#28352d"/>
      <circle cx="0" cy="-103" r="5" fill="#fff4d6"/>
      <!-- roof -->
      <path d="M-18 -112 L0 -128 L18 -112 Z" fill="#8a3f2a"/>
      <!-- light beam -->
      <path d="M0 -103 L120 -140 L120 -66 Z" fill="#fff4d6" opacity="0.18"/>
    </g>

    <!-- gentle grass/scrub texture on cliff top -->
    <g opacity="0.3" stroke="#7a8f7c" stroke-width="2">
      <line x1="80" y1="548" x2="82" y2="536"/>
      <line x1="95" y1="546" x2="98" y2="533"/>
      <line x1="200" y1="500" x2="203" y2="488"/>
      <line x1="215" y1="498" x2="217" y2="486"/>
      <line x1="330" y1="475" x2="332" y2="463"/>
    </g>
  </svg>

  <div class="content">
    <div class="contact-card">
      <p class="contact-line">Caso tenha interesse neste domínio contacte-me.</p>
      <p class="contact-line en">If you are interested in this domain, please get in touch with me.</p>
      <p class="contact-line email-line"><a href="mailto:pontadopargogolfmadeira@gmail.com">pontadopargogolfmadeira@gmail.com</a></p>
    </div>
  </div>

  <div class="domains-footer">
    <span class="domain-chip">pontadopargogolf.com</span>
    <span class="domain-chip">pontadopargogolfe.com</span>
    <span class="domain-chip">pontadopargogolfcourse.com</span>
  </div>

</div>

</body>
</html>
